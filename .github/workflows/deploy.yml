name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -f docker/Dockerfile -t ghcr.io/vladimirgolovanov/viewtherecipe-frontend/viewtherecipe-frontend:latest .
          docker push ghcr.io/vladimirgolovanov/viewtherecipe-frontend/viewtherecipe-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Copy k8s manifests to server
        run: |
          scp -i ~/.ssh/id_rsa -r k8s/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/projects/viewtherecipe-frontend/

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            kubectl apply -f /projects/viewtherecipe-frontend/k8s/
            kubectl rollout restart deployment/viewtherecipe-frontend -n savetherecipe
          EOF
